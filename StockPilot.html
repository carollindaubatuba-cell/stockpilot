        <td>${m.type === "in" ? '<span class="badge ok"><i></i>Stock in</span>' : m.type === "out" ? '<span class="badge bad"><i></i>Stock out</span>' : '<span class="badge info"><i></i>Adjustment</span>'}</td>
        <td class="t-right num" style="font-weight:650;color:${m.delta >= 0 ? "var(--success)" : "var(--danger)"}">${m.delta >= 0 ? "+" : ""}${m.delta}</td>
        <td class="t-right num">${qty(m.qty)}</td><td style="color:var(--muted)">${esc(m.reason || "—")}</td><td><span class="mono">${esc(m.ref || "—")}</span></td></tr>`).join("")}
      </tbody></table></div>` : emptyState("movements", "No stock movements", "Stock in, stock out and adjustments will be listed here.",
      `<button class="btn btn-primary" onclick="Forms.stock('in','${p.id}')">${ico("plus")}Record stock in</button>`)}</div>`;
  } else if (pdTab === "sales") {
    const lines = orders.flatMap(o => o.lines.filter(l => l.productId === p.id).map(l => ({ o, l })));
    body = `<div class="grid kpi-grid" style="margin-bottom:16px">
        ${kpiCard("Units sold", qty(sold), "orders", "info", "<span>Completed &amp; shipped</span>")}
        ${kpiCard("Revenue", money(rev), "money", "success", "<span>Lifetime</span>")}
        ${kpiCard("Avg. order quantity", (lines.length ? sum(lines, x => x.l.qty) / lines.length : 0).toFixed(1), "layers", "info", `<span>${lines.length} order lines</span>`)}
      </div>
      <div class="card">${lines.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th class="t-right">Qty</th><th class="t-right">Unit price</th><th class="t-right">Line total</th><th>Status</th></tr></thead>
        <tbody>${lines.map(({ o, l }) => `<tr class="row-link" onclick="Orders.view('${o.id}')"><td><b>${esc(o.number)}</b></td><td>${esc(o.customer)}</td><td>${fmtDate(o.date)}</td>
          <td class="t-right num">${qty(l.qty)}</td><td class="t-right num">${money(l.price)}</td><td class="t-right num"><b>${money(l.qty * l.price)}</b></td>
          <td>${orderBadge(o.status)}</td></tr>`).join("")}</tbody></table></div>`
        : emptyState("orders", "No sales yet", "Sales orders containing this product will appear here.")}</div>`;
  } else if (pdTab === "purchases") {
    const lines = purchases.flatMap(o => o.lines.filter(l => l.productId === p.id).map(l => ({ o, l })));
    body = `<div class="card">${lines.length ? `<div class="table-wrap"><table>
      <thead><tr><th>PO</th><th>Supplier</th><th>Ordered</th><th class="t-right">Qty</th><th class="t-right">Unit cost</th><th class="t-right">Line total</th><th>Status</th></tr></thead>
      <tbody>${lines.map(({ o, l }) => `<tr class="row-link" onclick="PO.view('${o.id}')"><td><b>${esc(o.number)}</b></td><td>${esc(Q.supName(o.supplierId))}</td><td>${fmtDate(o.orderDate)}</td>
        <td class="t-right num">${qty(l.qty)}</td><td class="t-right num">${money(l.unitCost)}</td><td class="t-right num"><b>${money(l.qty * l.unitCost)}</b></td>
        <td>${poBadge(o.status)}</td></tr>`).join("")}</tbody></table></div>`
      : emptyState("po", "No purchase history", "Purchase orders including this product will be listed here.",
        `<button class="btn btn-primary" onclick="Forms.po()">${ico("plus")}Create purchase order</button>`)}</div>`;
  } else {
    const acts = DB.activity.filter(a => a.productId === p.id || a.text.includes(p.name));
    body = `<div class="card"><div class="card-body">${acts.length ? `<div class="timeline">${acts.slice(0, 40).map(a => {
      const [icn, tone] = ACT_STYLE[a.type] || ["info", "info"];
      return `<div class="tl-item"><div class="tl-ico" style="background:var(--${tone}-bg);color:var(--${tone})">${ico(icn, "", 2)}</div>
        <div class="tl-body"><div class="tl-title">${esc(a.text)}</div><div class="tl-time">${ago(a.date)}</div></div></div>`;
    }).join("")}</div>` : emptyState("clock", "No activity recorded", "Actions on this product will show up here.")}</div></div>`;
  }

  return `
  <div class="breadcrumb no-print"><button onclick="Router.go('inventory')">Inventory</button>${ico("chevR", "", 2)}<span>${esc(p.name)}</span></div>
  <div class="card" style="margin-bottom:16px"><div class="card-body">
    <div class="pd-hero">
      <div class="pd-img">${p.image ? `<img src="${p.image}" alt="">` : esc(initials(p.name))}</div>
      <div style="flex:1;min-width:220px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="badge neutral" style="border-color:${Q.catColor(p.categoryId)}33;color:${Q.catColor(p.categoryId)};background:${Q.catColor(p.categoryId)}14">${esc(Q.catName(p.categoryId))}</span>
          ${statusBadge(st)}${p.archived ? '<span class="badge neutral"><i></i>Archived</span>' : ""}
        </div>
        <h1 style="margin-top:9px">${esc(p.name)}</h1>
        <div style="display:flex;gap:16px;color:var(--muted);font-size:12.5px;margin-top:6px;flex-wrap:wrap">
          <span class="mono">${esc(p.sku)}</span>${p.barcode ? `<span class="mono">${esc(p.barcode)}</span>` : ""}
          <span>${esc(Q.supName(p.supplierId))}</span><span>${esc(p.location || "No location")}</span></div>
      </div>
      <div class="head-actions no-print">
        <button class="btn" onclick="Forms.stock('in','${p.id}')">${ico("arrowDown")}Stock in</button>
        <button class="btn" onclick="Forms.stock('out','${p.id}')">${ico("arrowUp")}Stock out</button>
        <button class="btn btn-primary" onclick="Forms.product('${p.id}')">${ico("edit")}Edit product</button>
        <button class="icon-btn" onclick="Inv.rowMenu(event,'${p.id}')">${ico("dots")}</button>
      </div>
    </div>
  </div></div>

  <div class="grid kpi-grid" style="margin-bottom:16px">
    ${kpiCard("Current stock", qty(p.stock), "layers", st === "Out of Stock" ? "danger" : st === "Low Stock" ? "warning" : "success", `<span>${qty(available(p))} available · ${qty(p.reserved)} reserved</span>`)}
    ${kpiCard("Inventory value", money(invValue(p)), "money", "info", `<span>${qty(p.stock)} × ${money(p.cost)}</span>`)}
    ${kpiCard("Selling price", money(p.price), "tag", "info", `<span>${qty(sold)} units sold lifetime</span>`)}
    ${kpiCard("Cost price", money(p.cost), "money", "warning", `<span>${esc(Q.supName(p.supplierId))}</span>`)}
    ${kpiCard("Profit margin", margin(p).toFixed(1) + "%", "reports", margin(p) >= 40 ? "success" : margin(p) >= 20 ? "warning" : "danger", `<span>${money(p.price - p.cost)} per unit</span>`, margin(p))}
  </div>

  <div class="card"><div class="tabs" style="padding:0 var(--pad-card)">
    ${Object.entries(tabs).map(([k, l]) => `<button class="tab ${pdTab === k ? "active" : ""}" onclick="pdTab='${k}';Router.render()">${l}</button>`).join("")}
  </div></div>
  <div class="section-gap">${body}</div>`;
};

const Cats = {
  save(id, name, color, desc) {
    if (!name.trim()) { Toast.show("Name required", "Give the category a name.", "err"); return false; }
    if (id) { const c = Q.category(id); Object.assign(c, { name: name.trim(), color, description: desc }); logActivity("category", `Category updated: ${name}`); }
    else { DB.categories.push({ id: uid("cat"), name: name.trim(), color, description: desc }); logActivity("category", `New category added: ${name}`); }
    save(); Router.render(); Toast.show(id ? "Category updated" : "Category added", name);
    return true;
  },
  async remove(id) {
    const c = Q.category(id), n = DB.products.filter(p => p.categoryId === id).length;
    if (!await Modal.confirm("Delete category", `"${c.name}" will be removed.${n ? ` ${n} product(s) will become uncategorized.` : ""}`)) return;
    DB.categories = DB.categories.filter(x => x.id !== id);
    DB.products.forEach(p => { if (p.categoryId === id) p.categoryId = ""; });
    logActivity("category", `Category deleted: ${c.name}`);
    save(); Router.render(); Toast.show("Category deleted", c.name, "err");
  },
  form(id) {
    const c = id ? Q.category(id) : { name: "", color: CAT_COLORS[DB.categories.length % CAT_COLORS.length], description: "" };

      title: id ? "Edit category" : "New category", size: "slim",

      foot: `<button class="btn" onclick="Modal.close()">Cancel</button><button class="btn btn-primary" id="cGo">${id ? "Save changes" : "Add category"}</button>`,

};

<script>
"use strict";
/* ---------- status badges ---------- */
const PO_TONE = { Draft: "neutral", Pending: "warn", Ordered: "info", "Partially Received": "info", Received: "ok", Cancelled: "bad" };
const SO_TONE = { Pending: "warn", Processing: "info", Shipped: "info", Completed: "ok", Cancelled: "bad" };
const poBadge = s => `<span class="badge ${PO_TONE[s] || "neutral"}"><i></i>${s}</span>`;
const orderBadge = s => `<span class="badge ${SO_TONE[s] || "neutral"}"><i></i>${s}</span>`;

/* =====================  PURCHASE ORDERS  ===================== */
const PO = {
  f: "all",
  nextNumber() {
    const n = DB.pos.map(o => int(String(o.number).replace(/\D/g, ""))).filter(Boolean);
    return "PO-" + ((n.length ? Math.max(...n) : 1040) + 1);
  },
  list() { return DB.pos.filter(o => PO.f === "all" || o.status === PO.f).sort((a, b) => new Date(b.orderDate) - new Date(a.orderDate)); },
  setStatus(id, status) {
    const o = Q.po(id); if (!o) return;
    const prev = o.status;
    o.status = status;
    if (status === "Received" && !o.applied) {
      o.lines.forEach(l => {
        const p = Q.product(l.productId); if (!p) return;
        const already = Math.round(l.qty * (l.received || 0));
        const add = l.qty - already;
        if (add > 0) recordMovement({ productId: p.id, type: "in", qty: add, delta: add, reason: "Purchase received", ref: o.number, supplierId: o.supplierId, unitCost: l.unitCost });
        l.received = 1;
      });
      o.applied = true;
      notify("Purchase order received", `${o.number} has been received and inventory was updated.`, "ok");
    }
    if (status === "Partially Received" && !o.applied) {
      o.lines.forEach(l => {
        const half = Math.floor(l.qty / 2) - Math.round(l.qty * (l.received || 0));
        if (half > 0) recordMovement({ productId: l.productId, type: "in", qty: half, delta: half, reason: "Partial delivery", ref: o.number, supplierId: o.supplierId, unitCost: l.unitCost });
        l.received = 0.5;
      });
    }
    logActivity("po", `Purchase order ${o.number} moved from ${prev} to ${status}`);
    save(); Modal.closeAll(); Router.render();
    Toast.show("Purchase order updated", `${o.number} is now ${status}.`);
  },
  async remove(id) {
    const o = Q.po(id);
    if (!await Modal.confirm("Delete purchase order", `${o.number} will be permanently removed. Received stock is not reversed.`)) return;
    DB.pos = DB.pos.filter(x => x.id !== id);
    logActivity("po", `Purchase order ${o.number} deleted`);
    save(); Modal.closeAll(); Router.render(); Toast.show("Purchase order deleted", o.number, "err");
  },
  view(id) {
    const o = Q.po(id); if (!o) return;
    const s = Q.supplier(o.supplierId);
    Modal.open({
      title: o.number, sub: `${s ? s.company : "No supplier"} · ordered ${fmtDate(o.orderDate)}`, size: "wide",
      body: `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center">
          ${poBadge(o.status)}<span style="font-size:12.5px;color:var(--muted)">Expected ${fmtDate(o.expected)}</span>
          <div style="flex:1"></div>
          <select class="select" style="width:auto" onchange="PO.setStatus('${o.id}',this.value)">

const Orders = {
  f: "all",
  nextNumber() {
    const n = DB.orders.map(o => int(String(o.number).replace(/\D/g, ""))).filter(Boolean);
    return "SO-" + ((n.length ? Math.max(...n) : 3119) + 1);
  },
  list() { return DB.orders.filter(o => Orders.f === "all" || o.status === Orders.f).sort((a, b) => new Date(b.date) - new Date(a.date)); },
  setStatus(id, status) {
    const o = Q.order(id); if (!o) return;
    const prev = o.status;
    o.status = status;
    if (status === "Completed" && !o.applied) {
      o.lines.forEach(l => {
        const p = Q.product(l.productId); if (!p) return;
        const take = Math.min(l.qty, p.stock);
        if (take > 0) recordMovement({ productId: p.id, type: "out", qty: take, delta: -take, reason: "Sale", ref: o.number, customer: o.customer });
      });
      o.applied = true;
    }
    logActivity("order", `Order ${o.number} moved from ${prev} to ${status}`);
    save(); Modal.closeAll(); Router.render();
    Toast.show("Order updated", `${o.number} is now ${status}.`);
  },
  async remove(id) {
    const o = Q.order(id);
    if (!await Modal.confirm("Delete order", `${o.number} will be permanently removed. Stock already deducted is not restored.`)) return;
    DB.orders = DB.orders.filter(x => x.id !== id);
    logActivity("order", `Order ${o.number} deleted`);
    save(); Modal.closeAll(); Router.render(); Toast.show("Order deleted", o.number, "err");
  },
  view(id) {
    const o = Q.order(id); if (!o) return;
    Modal.open({
      title: o.number, sub: `${o.customer} · ${fmtDate(o.date)}`, size: "wide",
      body: `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center">

          <thead><tr><th>Product</th><th>SKU</th><th class="t-right">Qty</th><th class="t-right">Unit price</th><th class="t-right">Line total</th></tr></thead>
          <tbody>${o.lines.map(l => { const p = Q.product(l.productId); return `<tr>
            <td>${esc(p ? p.name : "Deleted product")}</td><td><span class="mono">${esc(p ? p.sku : "—")}</span></td>
            <td class="t-right num">${qty(l.qty)}</td><td class="t-right num">${money(l.price)}</td>
            <td class="t-right num"><b>${money(l.qty * l.price)}</b></td></tr>`; }).join("")}</tbody></table></div>
        <div class="po-total"><span style="color:var(--muted);font-size:13px">Total units <b style="color:var(--text)">${qty(orderUnits(o))}</b></span>
          <span style="font-size:15px">Order total <b>${money(orderTotal(o))}</b></span></div>
        ${o.notes ? `<div style="margin-top:16px"><div class="label">Notes</div><p style="font-size:13px;color:var(--muted);margin-top:4px">${esc(o.notes)}</p></div>` : ""}`,
      foot: `<button class="btn btn-ghost left" onclick="Orders.remove('${o.id}')">${ico("trash")}Delete</button>
        <button class="btn" onclick="Modal.close()">Close</button>
        <button class="btn" onclick="Modal.close();Forms.order('${o.id}')">${ico("edit")}Edit</button>
        ${o.status !== "Completed" && o.status !== "Cancelled" ? `<button class="btn btn-primary" onclick="Orders.setStatus('${o.id}','Completed')">${ico("check")}Mark completed</button>` : ""}`

Pages["low-stock"] = function () {

  const cost = sum(list, p => Math.max(p.reorder, p.min - p.stock) * p.cost);

        <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="Exp.backup()">${ico("export")}Download backup now</button>
      </div></div>
    </div>
  </div>`;
};
</script>
<script>
"use strict";
/* =====================  REPORTS  ===================== */
const Reports = {
  tab: "valuation", range: "90d", cat: "",
  set(k, v) { Reports[k] = v; Router.render(); },
  filtered() { return Q.products().filter(p => !Reports.cat || p.categoryId === Reports.cat); },
  csv() {
    const t = Reports.tab, ps = Reports.filtered();
    if (t === "valuation") Exp.csv("inventory-valuation", ["Product", "SKU", "Category", "Qty", "Cost", "Inventory value", "Retail value"],
      ps.map(p => [p.name, p.sku, Q.catName(p.categoryId), p.stock, p.cost.toFixed(2), invValue(p).toFixed(2), potentialRevenue(p).toFixed(2)]));
    else if (t === "movement") { const s = Analytics.series(Reports.range); Exp.csv("stock-movement", ["Period", "Units in", "Units out", "Purchases", "Sales"], s.raw.map(b => [b.label, b.unitsIn, b.unitsOut, b.purchases.toFixed(2), b.sales.toFixed(2)])); }
    else if (t === "best") Exp.csv("best-sellers", ["Product", "SKU", "Units sold", "Revenue"], Analytics.bestSellers(50).map(b => [b.p.name, b.p.sku, b.units, b.revenue.toFixed(2)]));
    else if (t === "slow") Exp.csv("slow-moving", ["Product", "SKU", "Units sold", "Stock", "Tied-up value"], Analytics.slowMovers(50).map(b => [b.p.name, b.p.sku, b.units, b.p.stock, invValue(b.p).toFixed(2)]));
    else if (t === "profit") Exp.csv("profitability", ["Product", "SKU", "Cost", "Price", "Margin %", "Potential profit"], ps.map(p => [p.name, p.sku, p.cost.toFixed(2), p.price.toFixed(2), margin(p).toFixed(1), potentialProfit(p).toFixed(2)]));
    else Exp.lowStockCSV();
  }
};
Pages.reports = function () {
  const tabs = { valuation: "Inventory valuation", movement: "Stock movement", best: "Best sellers", slow: "Slow moving", profit: "Profitability", low: "Low stock" };
  const ps = Reports.filtered();
  let body = "";
  if (Reports.tab === "valuation") {
    const cats = Analytics.byCategory().filter(c => !Reports.cat || c.id === Reports.cat);
    body = `<div class="two-col" style="margin-bottom:16px">
      <div class="card"><div class="card-head"><h2>Value by category</h2></div><div class="card-body"><div id="repBars"></div></div></div>
      <div class="card"><div class="card-head"><h2>Distribution</h2></div><div class="card-body"><div id="repDonut"></div></div></div></div>
      <div class="card"><div class="card-head"><h2>Valuation by product</h2><div class="card-title-sub">${ps.length} products</div></div>
      <div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th class="t-right">Qty</th><th class="t-right">Unit cost</th><th class="t-right">Inventory value</th><th class="t-right">Retail value</th><th class="t-right">Share</th></tr></thead>
      <tbody>${sortRows(ps, "v", -1, p => invValue(p)).map(p => `<tr><td>${esc(p.name)}</td><td><span class="mono">${esc(p.sku)}</span></td><td>${esc(Q.catName(p.categoryId))}</td>
        <td class="t-right num">${qty(p.stock)}</td><td class="t-right num">${money(p.cost)}</td><td class="t-right num"><b>${money(invValue(p))}</b></td>
        <td class="t-right num">${money(potentialRevenue(p))}</td>
        <td class="t-right num" style="color:var(--muted)">${((invValue(p) / Math.max(1, sum(ps, invValue))) * 100).toFixed(1)}%</td></tr>`).join("")}</tbody>
      <tfoot><tr style="background:var(--surface-2)"><td colspan="5" style="font-weight:700;height:48px;padding:0 14px">Total</td>
        <td class="t-right num" style="font-weight:700">${money(sum(ps, invValue))}</td>
        <td class="t-right num" style="font-weight:700">${money(sum(ps, potentialRevenue))}</td><td></td></tr></tfoot></table></div></div>`;
  } else if (Reports.tab === "movement") {
    const s = Analytics.series(Reports.range);
    body = `<div class="card" style="margin-bottom:16px"><div class="card-head"><div><h2>Stock in vs stock out</h2>
        <div class="card-title-sub">Units received against units sold or removed</div></div>
        <div class="seg no-print">${["7d", "30d", "90d", "12m"].map(r => `<button class="${Reports.range === r ? "active" : ""}" onclick="Reports.set('range','${r}')">${r === "12m" ? "12 months" : r.replace("d", " days")}</button>`).join("")}</div></div>
      <div class="card-body"><div id="repMove"></div></div></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>Period</th><th class="t-right">Units in</th><th class="t-right">Units out</th><th class="t-right">Net</th><th class="t-right">Purchases</th><th class="t-right">Sales</th></tr></thead>
        <tbody>${[...s.raw].reverse().map(b => `<tr><td>${esc(b.label)}</td><td class="t-right num" style="color:var(--success)">${b.unitsIn ? "+" + qty(b.unitsIn) : "—"}</td>
          <td class="t-right num" style="color:var(--danger)">${b.unitsOut ? "-" + qty(b.unitsOut) : "—"}</td>
          <td class="t-right num"><b>${b.unitsIn - b.unitsOut >= 0 ? "+" : ""}${qty(b.unitsIn - b.unitsOut)}</b></td>
          <td class="t-right num">${money(b.purchases, 0)}</td><td class="t-right num">${money(b.sales, 0)}</td></tr>`).join("")}</tbody></table></div></div>`;
  } else if (Reports.tab === "best") {
    const best = Analytics.bestSellers(15).filter(b => b.units > 0);
    body = `<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Revenue by product</h2></div><div class="card-body"><div id="repBars"></div></div></div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th style="width:52px">Rank</th><th>Product</th><th>Category</th><th class="t-right">Units sold</th><th class="t-right">Revenue</th><th class="t-right">Stock left</th><th>Status</th></tr></thead>
      <tbody>${best.length ? best.map((b, i) => `<tr class="row-link" onclick="Router.go('product',{id:'${b.p.id}'})">
        <td><span class="badge ${i < 3 ? "info" : "neutral"}">#${i + 1}</span></td><td><div class="cell-prod">${thumbOf(b.p)}<div class="cell-name">${esc(b.p.name)}</div></div></td>
        <td>${esc(Q.catName(b.p.categoryId))}</td><td class="t-right num">${qty(b.units)}</td><td class="t-right num"><b>${money(b.revenue)}</b></td>
        <td class="t-right num">${qty(b.p.stock)}</td><td>${statusBadge(statusOf(b.p))}</td></tr>`).join("")
        : `<tr><td colspan="7">${emptyState("orders", "No sales recorded yet", "Complete a sales order and your best sellers will appear here.")}</td></tr>`}</tbody></table></div></div>`;
  } else if (Reports.tab === "slow") {
    const slow = Analytics.slowMovers(20);
    body = `<div class="card"><div class="card-head"><div><h2>Slow moving products</h2>
      <div class="card-title-sub">Little or no sales movement — capital tied up in stock</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th class="t-right">Units sold</th><th class="t-right">Movements</th><th class="t-right">Stock</th><th class="t-right">Value tied up</th><th class="t-right">Days since update</th></tr></thead>
      <tbody>${slow.map(b => `<tr class="row-link" onclick="Router.go('product',{id:'${b.p.id}'})">
        <td><div class="cell-prod">${thumbOf(b.p)}<div><div class="cell-name">${esc(b.p.name)}</div><div class="cell-meta mono">${esc(b.p.sku)}</div></div></div></td>
        <td>${esc(Q.catName(b.p.categoryId))}</td><td class="t-right num">${qty(b.units)}</td><td class="t-right num">${b.moves}</td>
        <td class="t-right num">${qty(b.p.stock)}</td><td class="t-right num"><b>${money(invValue(b.p))}</b></td>
        <td class="t-right num" style="color:var(--muted)">${Math.round((Date.now() - new Date(b.p.updatedAt)) / 86400000)}</td></tr>`).join("")}</tbody></table></div></div>`;
  } else if (Reports.tab === "profit") {
    const rows = sortRows(ps, "x", -1, p => potentialProfit(p));
    const avgM = ps.length ? sum(ps, margin) / ps.length : 0;
    body = `<div class="grid kpi-grid" style="margin-bottom:16px">
        ${kpiCard("Inventory cost", money(sum(ps, invValue)), "money", "info", "<span>What you paid</span>")}
        ${kpiCard("Retail value", money(sum(ps, potentialRevenue)), "tag", "info", "<span>At current prices</span>")}
        ${kpiCard("Potential profit", money(sum(ps, potentialProfit)), "reports", "success", "<span>If everything sells</span>")}
        ${kpiCard("Average margin", avgM.toFixed(1) + "%", "reports", avgM >= 40 ? "success" : "warning", "<span>Across products</span>", avgM)}</div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>Product</th><th class="t-right">Cost</th><th class="t-right">Price</th><th class="t-right">Profit / unit</th><th class="t-right">Margin</th><th class="t-right">Stock</th><th class="t-right">Potential profit</th></tr></thead>
      <tbody>${rows.map(p => `<tr class="row-link" onclick="Router.go('product',{id:'${p.id}'})"><td><div class="cell-prod">${thumbOf(p)}<div class="cell-name">${esc(p.name)}</div></div></td>
        <td class="t-right num">${money(p.cost)}</td><td class="t-right num">${money(p.price)}</td><td class="t-right num">${money(p.price - p.cost)}</td>
        <td class="t-right"><span class="badge ${margin(p) >= 40 ? "ok" : margin(p) >= 20 ? "warn" : "bad"}">${margin(p).toFixed(1)}%</span></td>
        <td class="t-right num">${qty(p.stock)}</td><td class="t-right num"><b>${money(potentialProfit(p))}</b></td></tr>`).join("")}</tbody></table></div></div>`;
  } else {
    const low = ps.filter(p => p.stock <= p.min);
    body = `<div class="card"><div class="card-head"><div><h2>Low stock report</h2><div class="card-title-sub">${low.length} products approaching or below reorder level</div></div></div>
      ${low.length ? `<div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Supplier</th><th class="t-right">Stock</th><th class="t-right">Minimum</th><th class="t-right">Reorder qty</th><th class="t-right">Reorder cost</th><th>Urgency</th></tr></thead>
      <tbody>${low.map(p => { const u = urgency(p), rec = Math.max(p.reorder, (p.max || p.min * 3) - p.stock); return `<tr>
        <td>${esc(p.name)}</td><td><span class="mono">${esc(p.sku)}</span></td><td>${esc(Q.supName(p.supplierId))}</td>
        <td class="t-right num"><b>${qty(p.stock)}</b></td><td class="t-right num">${qty(p.min)}</td><td class="t-right num">${qty(rec)}</td>
        <td class="t-right num">${money(rec * p.cost)}</td><td><span class="badge ${u.tone}"><i></i>${u.label}</span></td></tr>`; }).join("")}</tbody></table></div>`
      : emptyState("check", "Nothing to reorder", "No products in this selection are below their minimum stock level.")}</div>`;
  }

  return `
  ${pageHead("Insights", "Reports", "Analytics across valuation, movement, sales and profitability", `
    <select class="select" style="width:auto;min-width:160px" onchange="Reports.set('cat',this.value)">${selectOptions(DB.categories, "id", "name", Reports.cat, "All categories")}</select>
    <button class="btn" onclick="window.print()">${ico("print")}Print</button>
    <button class="btn btn-primary" onclick="Reports.csv()">${ico("export")}Export CSV</button>`)}
  <div class="card no-print" style="margin-bottom:16px"><div class="tabs" style="padding:0 var(--pad-card)">
    ${Object.entries(tabs).map(([k, l]) => `<button class="tab ${Reports.tab === k ? "active" : ""}" onclick="Reports.set('tab','${k}')">${l}</button>`).join("")}
  </div></div>
  <div class="print-only" style="margin-bottom:14px"><b>${esc(DB.settings.business.name)}</b> · ${esc(tabs[Reports.tab])} · ${fmtDate(new Date(), "long")}</div>
  ${body}`;
};
Pages.after.reports = function () {
  if (Reports.tab === "valuation") {
    const cats = Analytics.byCategory().filter(c => !Reports.cat || c.id === Reports.cat);
    Charts.bars("repBars", cats.map(c => ({ name: c.name, value: c.value, color: c.color })), { fmt: v => money(v, 0) });
    Charts.donut("repDonut", cats.map(c => ({ name: c.name, value: c.units, color: c.color })),
      { fmt: v => qty(v), centerValue: qty(sum(cats, c => c.units)), centerLabel: "Units" });
  } else if (Reports.tab === "movement") {
    const s = Analytics.series(Reports.range);
    Charts.line("repMove", {
      key: "rep", labels: s.labels, fmtAxis: v => Math.round(v),
      series: [
        { key: "in", name: "Units in", color: "#22A06B", data: s.raw.map(b => b.unitsIn), fmt: qty },
        { key: "out", name: "Units out", color: "#E5484D", data: s.raw.map(b => b.unitsOut), fmt: qty, area: false },
      ]
    });
  } else if (Reports.tab === "best") {
    Charts.bars("repBars", Analytics.bestSellers(10).filter(b => b.revenue > 0).map(b => ({ name: b.p.name, value: b.revenue, color: Q.catColor(b.p.categoryId) })), { fmt: v => money(v, 0) });
  }
};

/* =====================  SETTINGS  ===================== */
const Settings = {
  t: "business",
  tab(t) { Settings.t = t; Router.go("settings"); },
  set(path, value) {
    const parts = path.split("."); let o = DB.settings;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
    save();
    if (["theme", "density"].includes(parts[parts.length - 1])) UI.paintTheme();
    Router.render();
  },
  async resetDemo() {
    if (!await Modal.confirm("Reset demo data", "All current products, orders and history will be replaced with the original sample catalogue. This cannot be undone.", "Reset data")) return;
    const theme = DB.settings.theme, density = DB.settings.density;
    DB = migrate(buildDemo());
    DB.settings.theme = theme; DB.settings.density = density;
    seedNotifications();
    save(); Router.go("dashboard"); Toast.show("Demo data restored", "Your sample catalogue is back.");
  },
  async wipe() {
    if (!await Modal.confirm("Delete all data", "Every product, supplier, order and movement will be erased, leaving an empty workspace.", "Delete everything")) return;
    const s = DB.settings;
    DB = { version: 1, settings: s, categories: [], suppliers: [], products: [], movements: [], pos: [], orders: [], notifications: [], activity: [] };
    save(); Router.go("dashboard"); Toast.show("Workspace cleared", "Start by adding a product.", "warn");
  }
};
Pages.settings = function () {
  const S = DB.settings, secs = { business: "Business information", inventory: "Inventory settings", notifications: "Notifications", appearance: "Appearance", data: "Data & backup" };
  let body = "";
  if (Settings.t === "business") {
    body = `<div class="card"><div class="card-head"><div><h2>Business information</h2><div class="card-title-sub">Shown on reports and exports</div></div></div>

          ${["FIFO", "LIFO", "Weighted average"].map(v => `<option ${S.valuation === v ? "selected" : ""}>${v}</option>`).join("")}</select>
          <span class="hint">Used to label valuation reports.</span></div>
        <div class="field"><label class="label">Currency</label><select class="select" onchange="Settings.set('currency',this.value)">
          ${Object.keys(CURRENCIES).map(c => `<option value="${c}" ${S.currency === c ? "selected" : ""}>${c} — ${CURRENCIES[c]}</option>`).join("")}</select></div>
      </div></div></div>`;
  } else if (Settings.t === "notifications") {
    const rows = [["low", "Low stock alerts", "Notify when a product drops to or below its minimum level"],
    ["out", "Out of stock alerts", "Notify the moment a product hits zero units"],
    ["po", "Purchase order alerts", "Notify when a purchase order is received"],
    ["digest", "Weekly inventory digest", "A summary of value, movement and reorder needs"]];
    body = `<div class="card"><div class="card-head"><div><h2>Notifications</h2><div class="card-title-sub">Choose what lands in your notification centre</div></div></div>
      <div class="card-body" style="padding-top:4px">${rows.map(([k, t, d]) => `<div class="set-row">
        <div><div class="t">${t}</div><div class="d">${d}</div></div>
        <button class="switch" aria-checked="${!!S.notif[k]}" onclick="Settings.set('notif.${k}',${!S.notif[k]})"></button></div>`).join("")}
        <div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="UI.markAllRead()">Mark all as read</button>
          <button class="btn btn-sm" onclick="DB.notifications=[];save();UI.paintBell();Toast.show('Notifications cleared')">Clear notification history</button></div>
      </div></div>`;
  } else if (Settings.t === "appearance") {
    body = `<div class="card"><div class="card-head"><div><h2>Appearance</h2><div class="card-title-sub">How StockPilot looks on this device</div></div></div>

        <div class="set-row"><div><div class="t">Theme</div><div class="d">Dark mode uses a deep navy palette designed for long sessions.</div></div>
          <div class="seg">${[["light", "Light"], ["dark", "Dark"]].map(([k, l]) => `<button class="${S.theme === k ? "active" : ""}" onclick="Settings.set('theme','${k}')">${l}</button>`).join("")}</div></div>

          <div class="seg">${[["comfortable", "Comfortable"], ["compact", "Compact"]].map(([k, l]) => `<button class="${S.density === k ? "active" : ""}" onclick="Settings.set('density','${k}')">${l}</button>`).join("")}</div></div>
      </div></div>`;

          <button class="btn" onclick="Exp.inventoryCSV()">${ico("export")}Export CSV</button></div>
        <div class="set-row"><div><div class="t">Reset to demo data</div><div class="d">Replace everything with the original sample catalogue.</div></div>

    <div>${body}</div>

};

<script>
"use strict";
/* =====================  FORMS  ===================== */
const Forms = {
  /* ---------- PRODUCT ---------- */
  product(id) {
    const isNew = !id;
    const S = DB.settings;
    const p = id ? { ...Q.product(id) } : {
      name: "", sku: "", barcode: "", categoryId: DB.categories[0]?.id || "", supplierId: DB.suppliers[0]?.id || "",
      description: "", cost: 0, price: 0, stock: 0, reserved: 0, min: S.defaultMin, max: 0, reorder: S.defaultReorder,
      location: "", image: "", notes: ""
    };
    let image = p.image;
    Modal.open({
      title: isNew ? "Add product" : "Edit product", sub: isNew ? "New item in your catalogue" : p.sku, size: "wide",
      body: `<div class="form-grid">
        <div class="field span2"><label class="label">Product name <span class="req">*</span></label>
          <input class="input" id="fName" value="${esc(p.name)}" placeholder="e.g. Wireless Keyboard K80"></div>
        <div class="field"><label class="label">SKU <span class="req">*</span></label>

        <div class="field"><label class="label">Minimum stock level</label><input class="input" id="fMin" type="number" min="0" value="${p.min}"></div>

          <div class="label" style="margin-bottom:6px">Automatic calculations</div>
          <div class="calc-strip">
            <div class="calc-cell"><span>Inventory value</span><b id="cVal">—</b></div>
            <div class="calc-cell"><span>Potential revenue</span><b id="cRev">—</b></div>
            <div class="calc-cell"><span>Potential profit</span><b id="cPro" style="color:var(--success)">—</b></div>
          </div></div>
      </div>`,
      foot: `${isNew ? "" : `<button class="btn btn-ghost left" onclick="Modal.close();Products.remove('${id}')">${ico("trash")}Delete</button>`}
        <button class="btn" onclick="Modal.close()">Cancel</button>
        <button class="btn btn-primary" id="fGo">${isNew ? "Add product" : "Save changes"}</button>`,
      onMount(ov) {
        const g = s => ov.querySelector(s);
        const calc = () => {
          const c = num(g("#fCost").value), pr = num(g("#fPrice").value), q = int(g("#fStock").value);
          g("#cVal").textContent = money(c * q);
          g("#cRev").textContent = money(pr * q);
          g("#cPro").textContent = money((pr - c) * q);
          g("#cPro").style.color = (pr - c) >= 0 ? "var(--success)" : "var(--danger)";
        };
        ["#fCost", "#fPrice", "#fStock"].forEach(s => g(s).addEventListener("input", calc));
        calc();
        if (isNew) g("#fName").addEventListener("blur", () => {
          if (!g("#fSku").value && g("#fName").value) {
            const c = Q.category(g("#fCat").value);
            g("#fSku").value = (c ? c.name.slice(0, 3).toUpperCase() : "SKU") + "-" + String(1000 + DB.products.length * 7 + rint(1, 90));
          }
        });
        const setImage = (url) => {
          image = url;
          g("#dzWrap").innerHTML = url ? Forms._preview(url) : Forms._dz();
          Forms._bindDropzone(ov, setImage);
        };
        Forms._bindDropzone(ov, setImage);
        ov.querySelector("#fGo").onclick = () => {
          const name = g("#fName").value.trim(), sku = g("#fSku").value.trim();
          let bad = false;
          [["#fName", name], ["#fSku", sku]].forEach(([sel, v]) => { g(sel).classList.toggle("invalid", !v); if (!v) bad = true; });
          if (bad) { Toast.show("Missing details", "Product name and SKU are required.", "err"); return; }
          if (DB.products.some(x => x.sku.toLowerCase() === sku.toLowerCase() && x.id !== id)) {
            g("#fSku").classList.add("invalid"); Toast.show("Duplicate SKU", "Another product already uses this SKU.", "err"); return;
          }
          const data = {
            name, sku, barcode: g("#fBar").value.trim(), categoryId: g("#fCat").value, supplierId: g("#fSup").value,
            description: g("#fDesc").value.trim(), cost: num(g("#fCost").value), price: num(g("#fPrice").value),
            reserved: int(g("#fRes").value), min: int(g("#fMin").value), max: int(g("#fMax").value),
            reorder: int(g("#fReorder").value), location: g("#fLoc").value.trim(), notes: g("#fNotes").value.trim(),
            image, updatedAt: new Date().toISOString()
          };
          if (isNew) {
            const opening = int(g("#fStock").value);
            const prod = Object.assign({ id: uid("prd"), stock: 0, archived: false, createdAt: new Date().toISOString() }, data);
            DB.products.unshift(prod);
            logActivity("product-add", `New product added: ${prod.name}`, { productId: prod.id });
            if (opening > 0) recordMovement({ productId: prod.id, type: "in", qty: opening, delta: opening, reason: "Opening stock", ref: "INIT" });
            else checkStockAlerts(prod);
            save(); Modal.close(); Router.render(); Toast.show("Product added", prod.name);
          } else {
            const prod = Q.product(id);
            Object.assign(prod, data);
            logActivity("product-edit", `Product updated: ${prod.name}`, { productId: prod.id });
            save(); Modal.close(); Router.render(); Toast.show("Changes saved", prod.name);
          }
        };
      }

  _dz() {
    return `<div class="dropzone" id="dz">${ico("upload")}<p><b>Click to upload</b> or drag an image here</p>
      <p style="font-size:11.5px;color:var(--faint);margin-top:3px">PNG or JPG · resized automatically</p></div>`;
  },
  _preview(url) {
    return `<div class="dz-preview"><img src="${url}" alt=""><div style="flex:1">
      <div style="font-size:13px;font-weight:600">Image attached</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">Stored with the product record</div>
      <div style="display:flex;gap:8px;margin-top:9px"><button class="btn btn-sm" id="dzChange" type="button">Replace</button>
      <button class="btn btn-sm btn-ghost" id="dzRemove" type="button">Remove</button></div></div></div>`;
  },
  _bindDropzone(ov, onImage) {
    const wrap = ov.querySelector("#dzWrap"), file = ov.querySelector("#fFile");
    if (!wrap || !file) return;
    const dz = wrap.querySelector("#dz");
    const change = wrap.querySelector("#dzChange"), remove = wrap.querySelector("#dzRemove");
    const load = f => {
      if (!f || !f.type.startsWith("image/")) { Toast.show("Unsupported file", "Choose a PNG or JPG image.", "err"); return; }
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 420, s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          onImage(c.toDataURL("image/jpeg", 0.78));
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    };
    if (dz) {
      dz.onclick = () => file.click();
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
      dz.ondragleave = () => dz.classList.remove("over");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); load(e.dataTransfer.files[0]); };
    }
    if (change) change.onclick = () => file.click();
    if (remove) remove.onclick = () => { wrap.innerHTML = Forms._dz(); onImage(""); };
    file.onchange = () => load(file.files[0]);
  },

  /* ---------- STOCK MOVEMENT ---------- */
  stock(type, productId) {
    const titles = { in: "Stock in", out: "Stock out", adjust: "Stock adjustment" };
    const subs = { in: "Receive units into inventory", out: "Remove units from inventory", adjust: "Correct the recorded quantity" };
    const prods = Q.products();
    if (!prods.length) { Toast.show("No products yet", "Add a product before recording stock.", "warn"); return; }
    const sel = productId || prods[0].id;
    const outReasons = ["Sale", "Damaged", "Lost", "Returned to supplier", "Sample", "Internal use"];
    const adjReasons = ["Cycle count correction", "Damaged goods write-off", "Found stock", "Data entry correction"];
    Modal.open({
      title: titles[type], sub: subs[type],
      body: `<div style="display:flex;flex-direction:column;gap:16px">
        <div class="field"><label class="label">Product <span class="req">*</span></label>
          <select class="select" id="sProd">${selectOptions(prods.map(p => ({ id: p.id, label: `${p.name} — ${p.sku} (${p.stock} in stock)` })), "id", "label", sel)}</select></div>
        <div id="sInfo"></div>
        ${type === "adjust" ? `<div class="form-grid">
            <div class="field"><label class="label">Current quantity</label><input class="input" id="sCurrent" readonly style="background:var(--surface-3)"></div>
            <div class="field"><label class="label">New quantity <span class="req">*</span></label><input class="input" id="sNew" type="number" min="0"></div></div>`
          : `<div class="form-grid">
            <div class="field"><label class="label">Quantity <span class="req">*</span></label><input class="input" id="sQty" type="number" min="1" value="1"></div>
            <div class="field"><label class="label">Date</label><input class="input" id="sDate" type="date" value="${dayKey(new Date())}"></div></div>`}
        ${type === "in" ? `<div class="form-grid">
            <div class="field"><label class="label">Supplier</label><select class="select" id="sSup">${selectOptions(DB.suppliers, "id", "company", "", "No supplier")}</select></div>
            <div class="field"><label class="label">Purchase cost per unit</label><div class="input-group"><span class="pre">${cur()}</span><input id="sCost" type="number" step="0.01" min="0" value="0"></div></div>
            <div class="field span2"><label class="label">Reference number</label><input class="input" id="sRef" placeholder="PO-1052, invoice no., etc."></div></div>` : ""}
        ${type === "out" ? `<div class="form-grid">
            <div class="field"><label class="label">Reason</label><select class="select" id="sReason">${outReasons.map(r => `<option>${r}</option>`).join("")}</select></div>
            <div class="field"><label class="label">Customer or order</label><input class="input" id="sCust" placeholder="Retail POS, SO-3140…"></div>
            <div class="field span2"><label class="label">Reference number</label><input class="input" id="sRef" placeholder="Optional"></div></div>` : ""}
        ${type === "adjust" ? `<div class="field"><label class="label">Reason</label><select class="select" id="sReason">${adjReasons.map(r => `<option>${r}</option>`).join("")}</select></div>` : ""}
        <div class="field"><label class="label">Notes</label><textarea class="textarea" id="sNotes" style="min-height:60px" placeholder="Optional"></textarea></div>
      </div>`,
      foot: `<button class="btn" onclick="Modal.close()">Cancel</button>
             <button class="btn btn-primary" id="sGo">${type === "in" ? "Add stock" : type === "out" ? "Remove stock" : "Save adjustment"}</button>`,
      onMount(ov) {
        const g = s => ov.querySelector(s);
        const paint = () => {
          const p = Q.product(g("#sProd").value);
          const st = statusOf(p);
          g("#sInfo").innerHTML = `<div style="display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r)">
            ${thumbOf(p)}<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:650">${esc(p.name)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:1px">On hand <b style="color:var(--text)">${qty(p.stock)}</b> · available ${qty(available(p))} · min ${qty(p.min)}</div></div>
            ${statusBadge(st)}</div>`;
          if (g("#sCurrent")) { g("#sCurrent").value = p.stock; if (!g("#sNew").value) g("#sNew").value = p.stock; }
          if (g("#sCost") && !num(g("#sCost").value)) g("#sCost").value = p.cost;
        };
        g("#sProd").onchange = paint; paint();
        g("#sGo").onclick = () => {
          const p = Q.product(g("#sProd").value);
          const notes = g("#sNotes").value.trim();
          const date = g("#sDate") ? new Date(g("#sDate").value + "T12:00:00").toISOString() : new Date().toISOString();
          if (type === "adjust") {
            const nq = int(g("#sNew").value), delta = nq - p.stock;
            if (!delta) { Toast.show("Nothing to change", "The new quantity matches the current one.", "warn"); return; }
            recordMovement({ productId: p.id, type: "adjust", qty: Math.abs(delta), delta, reason: g("#sReason").value, ref: "ADJ", notes, date });
            Toast.show("Adjustment saved", `${p.name} set to ${nq} units.`);
          } else {
            const q = int(g("#sQty").value);
            if (q < 1) { g("#sQty").classList.add("invalid"); Toast.show("Enter a quantity", "Quantity must be at least 1.", "err"); return; }
            if (type === "out" && q > p.stock) { Toast.show("Not enough stock", `Only ${p.stock} units on hand.`, "err"); return; }
            recordMovement({
              productId: p.id, type, qty: q, delta: type === "in" ? q : -q,
              reason: type === "in" ? "Stock received" : g("#sReason").value,
              ref: g("#sRef") ? g("#sRef").value.trim() : "", supplierId: g("#sSup") ? g("#sSup").value : "",
              customer: g("#sCust") ? g("#sCust").value.trim() : "", unitCost: g("#sCost") ? num(g("#sCost").value) : 0, notes, date
            });
            if (type === "in" && g("#sCost") && num(g("#sCost").value) > 0) p.cost = num(g("#sCost").value);
            Toast.show(type === "in" ? "Stock added" : "Stock removed", `${p.name} is now at ${p.stock} units.`);
          }
          save(); Modal.close(); Router.render();
        };
      }
    });
  },

  /* ---------- LINE EDITOR (shared by PO + order) ---------- */
  _lineEditor(ov, lines, mode, onChange) {
    const prods = Q.products();
    const priceKey = mode === "po" ? "unitCost" : "price";
    const render = () => {
      const wrap = ov.querySelector("#lines");
      wrap.innerHTML = `<div class="po-line po-line-head"><span>Product</span><span>Qty</span><span>${mode === "po" ? "Unit cost" : "Unit price"}</span><span style="text-align:right">Total</span><span></span></div>
        ${lines.length ? lines.map((l, i) => `<div class="po-line">
          <select class="select" data-i="${i}" data-f="productId">${selectOptions(prods.map(p => ({ id: p.id, label: `${p.name} — ${p.sku}` })), "id", "label", l.productId)}</select>
          <input class="input" type="number" min="1" value="${l.qty}" data-i="${i}" data-f="qty">
          <input class="input" type="number" step="0.01" min="0" value="${l[priceKey]}" data-i="${i}" data-f="${priceKey}">
          <div class="t-right num" style="font-weight:650;padding-right:4px">${money(l.qty * l[priceKey])}</div>
          <button class="icon-btn" style="width:30px;height:30px" data-del="${i}">${ico("trash", "", 2)}</button></div>`).join("")
          : `<div style="padding:26px;text-align:center;color:var(--muted);font-size:13px">No line items yet — add a product below.</div>`}
        <div class="po-total"><span style="color:var(--muted);font-size:13px">Units <b style="color:var(--text)">${qty(sum(lines, l => l.qty))}</b></span>
          <span style="font-size:15px">Total <b>${money(sum(lines, l => l.qty * l[priceKey]))}</b></span></div>`;
      wrap.querySelectorAll("[data-f]").forEach(el => {
        el.onchange = () => {
          const i = +el.dataset.i, f = el.dataset.f;
          lines[i][f] = f === "productId" ? el.value : num(el.value);
          if (f === "productId") { const p = Q.product(el.value); lines[i][priceKey] = mode === "po" ? p.cost : p.price; }
          if (f === "qty") lines[i].qty = Math.max(1, int(el.value));
          render(); onChange && onChange();
        };
      });
      wrap.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { lines.splice(+b.dataset.del, 1); render(); onChange && onChange(); });
    };
    ov.querySelector("#addLine").onclick = () => {
      const p = prods[0]; if (!p) { Toast.show("No products available", "Add a product first.", "warn"); return; }
      lines.push({ productId: p.id, qty: 1, [priceKey]: mode === "po" ? p.cost : p.price, received: 0 });
      render(); onChange && onChange();
    };
    render();
  },

  /* ---------- PURCHASE ORDER ---------- */
  po(id, supplierId, productId) {
    if (!DB.suppliers.length) { Toast.show("Add a supplier first", "Purchase orders need a supplier.", "warn"); Forms.supplier(); return; }
    const existing = id ? Q.po(id) : null;
    const lines = existing ? existing.lines.map(l => ({ ...l }))
      : productId ? [{ productId, qty: Math.max(1, Q.product(productId)?.reorder || 10), unitCost: Q.product(productId)?.cost || 0, received: 0 }]
        : supplierId ? Q.products().filter(p => p.supplierId === supplierId && p.stock <= p.min).slice(0, 8)
          .map(p => ({ productId: p.id, qty: Math.max(p.reorder, (p.max || p.min * 3) - p.stock), unitCost: p.cost, received: 0 })) : [];
    Modal.open({
      title: existing ? `Edit ${existing.number}` : "Create purchase order", sub: existing ? "" : "Order stock from a supplier", size: "wide",
      body: `<div class="form-grid" style="margin-bottom:18px">
          <div class="field"><label class="label">Supplier <span class="req">*</span></label>
            <select class="select" id="pSup">${selectOptions(DB.suppliers, "id", "company", existing ? existing.supplierId : supplierId || DB.suppliers[0].id)}</select></div>
          <div class="field"><label class="label">PO number</label><input class="input" id="pNum" value="${esc(existing ? existing.number : PO.nextNumber())}"></div>
          <div class="field"><label class="label">Order date</label><input class="input" id="pDate" type="date" value="${dayKey(existing ? existing.orderDate : new Date())}"></div>
          <div class="field"><label class="label">Expected delivery</label><input class="input" id="pExp" type="date" value="${dayKey(existing ? existing.expected : daysAhead(10))}"></div>
          <div class="field span2"><label class="label">Status</label><select class="select" id="pStatus">
            ${["Draft", "Pending", "Ordered", "Partially Received", "Received", "Cancelled"].map(s => `<option ${(existing ? existing.status : "Draft") === s ? "selected" : ""}>${s}</option>`).join("")}</select>
            <span class="hint">Setting a new order to Received adds its units to inventory immediately.</span></div>
        </div>
        <div class="label" style="margin-bottom:7px">Line items</div>
        <div class="po-lines" id="lines"></div>
        <button class="btn btn-sm" id="addLine" style="margin-top:10px">${ico("plus")}Add line item</button>
        <div class="field" style="margin-top:18px"><label class="label">Notes</label>
          <textarea class="textarea" id="pNotes" style="min-height:60px" placeholder="Delivery instructions, payment terms…">${esc(existing?.notes || "")}</textarea></div>`,
      foot: `<button class="btn" onclick="Modal.close()">Cancel</button><button class="btn btn-primary" id="pGo">${existing ? "Save changes" : "Create purchase order"}</button>`,
      onMount(ov) {
        Forms._lineEditor(ov, lines, "po");
        ov.querySelector("#pGo").onclick = () => {
          if (!lines.length) { Toast.show("Add at least one line", "A purchase order needs products.", "err"); return; }
          const status = ov.querySelector("#pStatus").value;
          const data = {
            number: ov.querySelector("#pNum").value.trim() || PO.nextNumber(),
            supplierId: ov.querySelector("#pSup").value,
            orderDate: new Date(ov.querySelector("#pDate").value + "T12:00:00").toISOString(),
            expected: new Date(ov.querySelector("#pExp").value + "T12:00:00").toISOString(),
            lines, notes: ov.querySelector("#pNotes").value.trim(),
          };
          if (existing) {
            Object.assign(existing, data);
            logActivity("po", `Purchase order ${existing.number} updated`);
            save();
            if (existing.status !== status) { Modal.close(); PO.setStatus(existing.id, status); return; }
            Modal.close(); Router.render(); Toast.show("Purchase order saved", existing.number);
          } else {
            const po = Object.assign({ id: uid("po"), status: "Draft", applied: false, createdAt: new Date().toISOString() }, data);
            DB.pos.unshift(po);
            logActivity("po", `Purchase order ${po.number} created for ${Q.supName(po.supplierId)}`);
            save();
            if (status !== "Draft") { Modal.close(); PO.setStatus(po.id, status); return; }
            Modal.close(); Router.render(); Toast.show("Purchase order created", po.number);
          }
        };
      }
    });
  },

  /* ---------- SALES ORDER ---------- */
  order(id) {
    const existing = id ? Q.order(id) : null;
    const lines = existing ? existing.lines.map(l => ({ ...l })) : [];
    Modal.open({
      title: existing ? `Edit ${existing.number}` : "Create sales order", sub: existing ? existing.customer : "Record a customer order", size: "wide",
      body: `<div class="form-grid" style="margin-bottom:18px">
          <div class="field"><label class="label">Customer <span class="req">*</span></label>
            <input class="input" id="oCust" value="${esc(existing?.customer || "")}" placeholder="Willow Lane Boutique"></div>
          <div class="field"><label class="label">Order number</label><input class="input" id="oNum" value="${esc(existing ? existing.number : Orders.nextNumber())}"></div>
          <div class="field"><label class="label">Order date</label><input class="input" id="oDate" type="date" value="${dayKey(existing ? existing.date : new Date())}"></div>
          <div class="field"><label class="label">Status</label><select class="select" id="oStatus">
            ${["Pending", "Processing", "Shipped", "Completed", "Cancelled"].map(s => `<option ${(existing ? existing.status : "Pending") === s ? "selected" : ""}>${s}</option>`).join("")}</select>
            <span class="hint">Completing an order deducts its units from stock.</span></div>
        </div>
        <div class="label" style="margin-bottom:7px">Line items</div>
        <div class="po-lines" id="lines"></div>
        <button class="btn btn-sm" id="addLine" style="margin-top:10px">${ico("plus")}Add line item</button>
        <div class="field" style="margin-top:18px"><label class="label">Notes</label>
          <textarea class="textarea" id="oNotes" style="min-height:60px">${esc(existing?.notes || "")}</textarea></div>`,
      foot: `<button class="btn" onclick="Modal.close()">Cancel</button><button class="btn btn-primary" id="oGo">${existing ? "Save changes" : "Create order"}</button>`,
      onMount(ov) {
        Forms._lineEditor(ov, lines, "so");
        ov.querySelector("#oGo").onclick = () => {
          const customer = ov.querySelector("#oCust").value.trim();
          if (!customer) { ov.querySelector("#oCust").classList.add("invalid"); Toast.show("Customer required", "", "err"); return; }
          if (!lines.length) { Toast.show("Add at least one line", "An order needs products.", "err"); return; }
          const status = ov.querySelector("#oStatus").value;
          const data = {
            number: ov.querySelector("#oNum").value.trim() || Orders.nextNumber(), customer,
            date: new Date(ov.querySelector("#oDate").value + "T12:00:00").toISOString(),
            lines, notes: ov.querySelector("#oNotes").value.trim(),
          };
          if (existing) {
            Object.assign(existing, data);
            logActivity("order", `Order ${existing.number} updated`);
            save();
            if (existing.status !== status) { Modal.close(); Orders.setStatus(existing.id, status); return; }
            Modal.close(); Router.render(); Toast.show("Order saved", existing.number);
          } else {
            const o = Object.assign({ id: uid("so"), status: "Pending", applied: false, createdAt: new Date().toISOString() }, data);
            DB.orders.unshift(o);
            logActivity("order", `Order ${o.number} created for ${o.customer}`);
            save();
            if (status !== "Pending") { Modal.close(); Orders.setStatus(o.id, status); return; }
            Modal.close(); Router.render(); Toast.show("Order created", o.number);
          }
        };
      }
    });
  }
};

/* =====================  EXPORT / IMPORT  ===================== */
const Exp = {
  download(name, text, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  },
  csv(name, headers, rows) {
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const text = [headers.map(q).join(","), ...rows.map(r => r.map(q).join(","))].join("\r\n");
    Exp.download(`${name}-${dayKey(new Date())}.csv`, "\uFEFF" + text, "text/csv;charset=utf-8");
    Toast.show("Export ready", `${rows.length} rows downloaded as CSV.`);
  },
  inventoryCSV(list) {
    const ps = list && list.length ? list : Inv.sorted();
    Exp.csv("stockpilot-inventory",
      ["Product", "SKU", "Barcode", "Category", "Supplier", "Stock", "Available", "Reserved", "Cost", "Price", "Inventory value", "Status", "Location", "Last updated"],
      ps.map(p => [p.name, p.sku, p.barcode, Q.catName(p.categoryId), Q.supName(p.supplierId), p.stock, available(p), p.reserved,
      p.cost.toFixed(2), p.price.toFixed(2), invValue(p).toFixed(2), statusOf(p), p.location, fmtDate(p.updatedAt)]));
  },
  suppliersCSV() {
    Exp.csv("stockpilot-suppliers", ["Company", "Contact", "Email", "Phone", "Website", "Address", "Products", "Total purchases"],
      DB.suppliers.map(s => [s.company, s.contact, s.email, s.phone, s.website, s.address, Sup.productCount(s.id), Sup.purchaseValue(s.id).toFixed(2)]));
  },
  poCSV() {
    Exp.csv("stockpilot-purchase-orders", ["PO number", "Supplier", "Order date", "Expected", "Items", "Units", "Total", "Status"],
      DB.pos.map(o => [o.number, Q.supName(o.supplierId), fmtDate(o.orderDate), fmtDate(o.expected), o.lines.length, sum(o.lines, l => l.qty), poTotal(o).toFixed(2), o.status]));
  },
  ordersCSV() {
    Exp.csv("stockpilot-orders", ["Order", "Customer", "Date", "Items", "Units", "Total", "Status"],
      DB.orders.map(o => [o.number, o.customer, fmtDate(o.date), o.lines.length, orderUnits(o), orderTotal(o).toFixed(2), o.status]));
  },
  movementsCSV() {
    Exp.csv("stockpilot-stock-movements", ["Date", "Product", "SKU", "Type", "Change", "Quantity", "Reason", "Reference", "Source"],
      Moves.list().map(m => { const p = Q.product(m.productId); return [fmtDate(m.date), p?.name || "Deleted", p?.sku || "", m.type, m.delta, m.qty, m.reason, m.ref, m.supplierId ? Q.supName(m.supplierId) : m.customer]; }));
  },
  lowStockCSV() {
    const low = Q.products().filter(p => p.stock <= p.min);
    Exp.csv("stockpilot-low-stock", ["Product", "SKU", "Supplier", "Stock", "Minimum", "Recommended reorder", "Estimated cost", "Urgency"],
      low.map(p => { const rec = Math.max(p.reorder, (p.max || p.min * 3) - p.stock); return [p.name, p.sku, Q.supName(p.supplierId), p.stock, p.min, rec, (rec * p.cost).toFixed(2), urgency(p).label]; }));
  },
  backup() {
    Exp.download(`stockpilot-backup-${dayKey(new Date())}.json`, JSON.stringify(DB, null, 2), "application/json");
    Toast.show("Backup downloaded", "Keep this file somewhere safe.");
  },
  importPrompt() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.onchange = () => {
      const f = input.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const data = JSON.parse(r.result);
          if (!data || !Array.isArray(data.products)) throw new Error("shape");
          if (!await Modal.confirm("Import backup", `This replaces your current workspace with ${data.products.length} products from the file.`, "Import", "primary")) return;
          DB = migrate(data);
          DB.pos.forEach(o => o.applied = o.applied ?? (o.status === "Received"));
          DB.orders.forEach(o => o.applied = o.applied ?? ["Completed", "Shipped"].includes(o.status));
          save(); UI.paintTheme(); Router.go("dashboard");
          Toast.show("Backup imported", `${DB.products.length} products restored.`);
        } catch (e) {
          Toast.show("Import failed", "That file isn't a valid StockPilot backup.", "err");
        }
      };
      r.readAsText(f);
    };
    input.click();
  }
};

/* =====================  BOOT  ===================== */
function seedNotifications() {
  const t = totals();
  const low = Q.products().filter(p => p.stock > 0 && p.stock <= p.min).slice(0, 2);
  DB.notifications = [];
  low.forEach(p => notify("Low stock", `${p.name} is below its minimum of ${p.min} units.`, "warn"));
  if (t.out) notify("Out of stock", `${t.out} products are currently out of stock.`, "err");
  const received = DB.pos.find(o => o.status === "Received");
  if (received) notify("Purchase order received", `${received.number} has been received and inventory was updated.`, "ok");
  notify("Inventory value updated", `Total inventory value is now ${money(t.value)}.`, "info");
}
function seedActivity() {
  if (DB.activity.length) return;
  DB.movements.slice(0, 12).forEach(m => {
    const p = Q.product(m.productId); if (!p) return;
    DB.activity.push({
      id: uid("act"), type: m.delta >= 0 ? "stock-in" : "stock-out", productId: p.id, date: m.date,
      text: `${p.name} stock ${m.delta >= 0 ? "increased" : "decreased"} by ${Math.abs(m.delta)} units`
    });
  });
  const s = DB.suppliers[0];
  if (s) DB.activity.push({ id: uid("act"), type: "supplier", date: daysAgo(3), text: `New supplier added: ${s.company}` });
  const po = DB.pos.find(o => o.status === "Received");
  if (po) DB.activity.push({ id: uid("act"), type: "po", date: daysAgo(2), text: `Purchase order ${po.number} received from ${Q.supName(po.supplierId)}` });
  const pr = DB.products[0];
  if (pr) DB.activity.push({ id: uid("act"), type: "product-add", productId: pr.id, date: daysAgo(5), text: `Product added: ${pr.name}` });
  DB.activity.sort((a, b) => new Date(b.date) - new Date(a.date));
}

function boot() {
  const saved = Store.read();
  DB = migrate(saved || buildDemo());
  DB.pos.forEach(o => o.applied = o.applied ?? (o.status === "Received"));
  DB.orders.forEach(o => o.applied = o.applied ?? ["Completed", "Shipped"].includes(o.status));
  seedActivity();
  if (!saved) seedNotifications();
  save();
  UI.paintTheme();
  UI.paintBell();
  ROUTE = Router.fromHash();
  if (!Pages[ROUTE.page]) ROUTE = { page: "dashboard", params: {} };
  Router.render();

  window.addEventListener("hashchange", () => {
    const r = Router.fromHash();
    if (r.page !== ROUTE.page || r.params.id !== ROUTE.params.id) { ROUTE = Pages[r.page] ? r : { page: "dashboard", params: {} }; Router.render(); }
  });
  window.addEventListener("resize", debounce(() => { if (window.innerWidth > 900) UI.closeSidebar(); Pop.close(); }, 180));
  document.addEventListener("keydown", e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#globalSearch").focus(); $("#globalSearch").select(); return; }
    if (e.key === "Escape") { Pop.close(); if (Modal.stack.length) Modal.close(); else UI.closeSidebar(); return; }
    if (typing) return;
    if (e.key === "/") { e.preventDefault(); $("#globalSearch").focus(); }
    if (e.key.toLowerCase() === "n") { e.preventDefault(); Forms.product(); }
  });
}
document.addEventListener("DOMContentLoaded", boot);
</script>
